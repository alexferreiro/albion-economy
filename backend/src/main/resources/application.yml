spring:
  application:
    name: albion-economy
  profiles:
    active: dev

---
# DEV — H2 file-based (data persists between restarts)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./albiondb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

server:
  port: 8080

app:
  jwt:
    secret: dev-secret-key-albion-economy-change-in-production-must-be-long
    expiration-ms: 86400000

---
# PROD — PostgreSQL (Railway)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000